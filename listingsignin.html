<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Air</title>
    <link rel="stylesheet" href="listingsignin.css">
</head>
<body>
   

    <main class="signin-main">
        <form class="signin-card" action="#" method="post">
            <p class="eyebrow">WELCOME</p>
            <h2>Sign in </h2>
            <p class="intro">Sign into your listing account</p>

            <label for="email">Email address</label>
            <input id="email" name="email" type="email" autocomplete="email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>

            <div class="form-actions">
                <button type="submit">Continue</button>
              
                
            </div>
        </form>

        <section id="help" class="sr-only" aria-label="Help and support"></section>
        <section id="contact" class="sr-only" aria-label="Contact Us"></section>
    </main>
</body>
</html>
